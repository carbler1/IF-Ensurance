# Single-page app: every unknown path serves index.html, and Expo Router picks the screen.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
