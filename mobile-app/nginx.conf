# Single-page app: every unknown path serves index.html, and Expo Router picks the screen.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA fallback re-enters here, so deep links get this header too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # 21m: above the backend's 20 MB limit, so the backend returns its JSON too_large error.
        client_max_body_size 21m;
        proxy_read_timeout 300s;
    }

    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
