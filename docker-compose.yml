# Postgres, the backend (FastAPI + worker), the If staff dashboard (Next.js) and the web demo
# of the customer app (Expo). The dashboard reads and writes Postgres directly.
# Setup: cp .env.example .env and set POSTGRES_PASSWORD and the tokens. Then: docker compose up --build
# Dashboard: http://localhost:3000   App demo: http://localhost:8082   API: http://localhost:8000
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ilp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # for local tools and `npm run dev` in frontend/
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ilp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ilp}
      # Ollama runs on the host, outside the container.
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-var:/app/var # uploaded PDFs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build: ./frontend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ilp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ilp}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      # The backend creates the tables and seeds them on its first start.
      backend:
        condition: service_healthy

  mobile:
    build: ./mobile-app
    ports:
      - "${MOBILE_PORT:-8082}:80"

volumes:
  postgres-data:
  backend-var:
