# Postgres, the backend (FastAPI + worker), the If staff dashboard (Next.js) and the web demo
# of the customer app (Expo). Only the backend talks to Postgres; the dashboard calls the
# backend's /v1/admin API. Postgres is on the private "db" network with the backend only and has
# no host port, so the dashboard (on the "app" network) cannot reach it at all.
# The backend runs the Alembic migrations (backend/migrations/) on start.
# Setup: cp .env.example .env and set POSTGRES_PASSWORD, ADMIN_TOKEN, the tokens and the two domains.
# Then: docker compose up --build
# Only Caddy publishes ports (80 and 443): the app at APP_DOMAIN, the dashboard at DASHBOARD_DOMAIN.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ilp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ilp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ilp}
      # Ollama runs outside the container; the default is the host.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      CUSTOMER_TOKEN: ${CUSTOMER_TOKEN:?Set CUSTOMER_TOKEN in .env}
      # The browser origins that may call the API (default: the app demo below and Expo's web dev server).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${MOBILE_PORT:-8082},http://localhost:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-var:/app/var # uploaded PDFs
    networks:
      - db
      - app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    restart: unless-stopped
    build: ./frontend
    environment:
      # Server-side calls over the compose network; the browser never sees the token.
      BACKEND_URL: http://backend:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      # Read-only unless set to 0 or false.
      DASHBOARD_READONLY: ${DASHBOARD_READONLY:-1}
      # Signs the dashboard login cookie (16+ random characters).
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy

  mobile:
    restart: unless-stopped
    build:
      context: ./mobile-app
      args:
        # The public origin of the app; nginx proxies its /v1/ to the backend.
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8082}
    networks:
      - app
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # HTTPS certificates
    networks:
      - app
    depends_on:
      - mobile
      - frontend

networks:
  db:
    internal: true # no route out of this network; only the backend and Postgres are on it
  app:

volumes:
  caddy-data:
  postgres-data:
  backend-var:
